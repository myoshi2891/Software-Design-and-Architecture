# Netlify デプロイ設定（web-next/ を静的エクスポートして配信する）
#
# - bun.lock は追跡外のため Netlify は npm で依存を解決する。npm 10 は本プロジェクトの
#   peer 依存グラフで内部エラーになるため --legacy-peer-deps を付ける。
#   脆弱性対策の最低バージョンは web-next/package.json の overrides で保証する。
# - 著作権リスクのため除外した書籍ガイドは git 追跡外なので、ビルドに含まれない。

[build]
  base = "web-next"
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
