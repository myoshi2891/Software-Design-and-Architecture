<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="設計手法ガイド">
  <title>設計手法ガイド</title>
  <rect width="32" height="32" rx="7" fill="#0f1117"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#3a4468"/>
  <!-- 積層アーキテクチャを表す 3 層。上位ほど狭く、色はデザイントークンの purple/teal/blue -->
